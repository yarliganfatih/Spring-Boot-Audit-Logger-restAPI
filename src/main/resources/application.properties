spring.application.name=restapi

# Database Properties
spring.datasource.initialization-mode=always
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/restapi?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username = root
spring.datasource.password = root

# Hibernate Properties
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.implicit-strategy=com.draft.restapi.common.config.CustomImplicitNamingStrategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect

# Cache Properties
spring.cache.type=redis
spring.cache.redis.time-to-live=60m

# Rate Limiting Properties
spring.application.ratelimit.capacity=20
spring.application.ratelimit.time-to-refill=60s

# Redis Properties
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=6379
spring.redis.max-timeout=500ms

# Suppress background connection logs when Redis is unavailable
logging.level.io.lettuce.core.protocol.ConnectionWatchdog=ERROR
logging.level.io.lettuce.core.protocol.ReconnectionHandler=ERROR
logging.level.org.redisson.client.handler.PingConnectionHandler=OFF
logging.level.org.redisson.eviction.MapCacheEvictionTask=OFF

# Resilience4j Properties (Redis Cache)
resilience4j.circuitbreaker.instances.redisCache.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.redisCache.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.redisCache.sliding-window-size=20
resilience4j.circuitbreaker.instances.redisCache.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.redisCache.ignore-exceptions[0]=org.springframework.cache.Cache$ValueRetrievalException

# Resilience4j Properties (Redis Rate Limiter)
resilience4j.circuitbreaker.instances.redisRateLimiter.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.redisRateLimiter.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.redisRateLimiter.sliding-window-size=10
resilience4j.circuitbreaker.instances.redisRateLimiter.minimum-number-of-calls=5

# Springdoc / Swagger UI Properties
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
