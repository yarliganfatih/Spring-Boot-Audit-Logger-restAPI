spring.main.allow-bean-definition-overriding=true
security.oauth2.resource.stateless=false

# Database Properties
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.naming.implicit-strategy=com.draft.restapi.common.config.CustomImplicitNamingStrategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Cache Properties
spring.cache.type=simple
spring.cache.redis.time-to-live=60m

# Rate Limiting Properties
spring.application.ratelimit.capacity=10000
spring.application.ratelimit.time-to-refill=60s

# Resilience4j Properties (Redis Cache)
resilience4j.circuitbreaker.instances.redisCache.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.redisCache.wait-duration-in-open-state=3s
resilience4j.circuitbreaker.instances.redisCache.sliding-window-size=20
resilience4j.circuitbreaker.instances.redisCache.minimum-number-of-calls=10

# Resilience4j Properties (Redis Rate Limiter)
resilience4j.circuitbreaker.instances.redisRateLimiter.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.redisRateLimiter.wait-duration-in-open-state=3s
resilience4j.circuitbreaker.instances.redisRateLimiter.sliding-window-size=10
resilience4j.circuitbreaker.instances.redisRateLimiter.minimum-number-of-calls=5
